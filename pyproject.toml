[project]
name = "fyuneru"
version = "0.1.0"
description = "Python 工具库，封装常用基础设施组件，提供统一、可组合的函数式接口。"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "pyyaml>=6.0.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "numpy>=2.4",
    "pyclean",
    "pyrefly",
    "ruff",
]

[project.optional-dependencies]
redis = [
    "redis>=7.1.0",
]
s3 = [
    "boto3>=1.42.45",
    "mypy-boto3-s3>=1.42.37",
]
pipeline = [
  "fyuneru[redis]",
  "dramatiq>=2.0.1",
]
media = [
    "av>=16.1.0",
    "pillow>=12.1.1",
]
gemini = [
    "google-genai>=1.65.0",
]
mongo = [
    "pymongo>=4.16.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.pyrefly]
