[project]
name = "fyuneru"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "loguru>=0.7.3",
    "returns>=0.26.0",
    "tqdm>=4.67.3",
]

[project.optional-dependencies]
redis = [
    "redis>=7.1.0",
]
s3 = [
    "boto3>=1.42.45",
    "mypy-boto3-s3>=1.42.37",
]
pipeline = [
  "fyuneru[redis,s3]",
  "dramatiq>=2.0.1",
  "pymongo>=4.16.0",
]
media = [
    "av>=16.1.0",
    "pillow>=12.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
select = ["I"]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[dependency-groups]
dev = [
    "pyclean>=3.5.0",
]

[tool.pyrefly]
