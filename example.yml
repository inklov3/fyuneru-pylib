redis:
  host: localhost
  port: 6379
  db: 0
  cluster: false  # 可选，默认 false
  password: xxx  # 可选，无密码时省略

s3:
  endpoint: https://s3.example.com
  access_key_id: xxx
  secret_access_key: xxx
  region_name: us-east-1  # 可选
  bucket: my-workspace-bucket  # init_workspace_from_config 必选

mongo:
  uri: mongodb://localhost:27017
  db: my_database  # init_database_from_config 必选
  timeout: 10000  # 可选

llm:
  provider: gemini  # 标识使用哪个 provider
  api_key: xxx
  endpoint: https://api.example.com
  api_version: v1beta  # 可选


s3_sources:
- source_id: my-images
  endpoint: https://s3.example.com
  bucket: actual-bucket-name
  access_key_id: xxx
  secret_access_key: xxx
  region_name: us-east-1

- source_id: backup-store
  endpoint: https://s3.backup.com
  bucket: backup-bucket
  access_key_id: xxx
  secret_access_key: xxx
